plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.guardian'
version = '1.0.0'
android {
  namespace 'expo.modules.guardian'
  defaultConfig { minSdkVersion 26; versionCode 1; versionName '1.0.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
  sourceSets { main { assets.srcDirs += '../../../benchmarks' } }
  testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
  implementation 'com.google.ai.edge.litertlm:litertlm-android:0.15.0'
  implementation 'androidx.core:core-ktx:1.17.0'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20250517'
}
