plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.20'
  id 'org.jetbrains.kotlin.plugin.compose' version '2.3.20'
}

android {
  namespace 'helium314.keyboard.latin'
  compileSdk 36
  ndkVersion '28.2.13676358'
  defaultConfig {
    minSdk 26
    consumerProguardFiles 'consumer-rules.pro'
    buildConfigField 'String', 'APPLICATION_ID', '"com.mikolajpiech.guardian"'
    buildConfigField 'int', 'VERSION_CODE', '4000'
    buildConfigField 'String', 'VERSION_NAME', '"4.0 · Cue"'
    ndk { abiFilters.addAll((findProperty('reactNativeArchitectures') ?: 'armeabi-v7a,arm64-v8a,x86,x86_64').split(',')) }
  }
  buildFeatures { viewBinding true; buildConfig true; compose true }
  externalNativeBuild { ndkBuild { path file('src/main/jni/Android.mk') } }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }
  kotlinOptions { jvmTarget = '17' }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.17.0'
  implementation 'androidx.recyclerview:recyclerview:1.4.0'
  implementation 'androidx.autofill:autofill:1.3.0'
  implementation 'androidx.viewpager2:viewpager2:1.1.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
  implementation platform('androidx.compose:compose-bom:2025.11.01')
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  implementation 'androidx.navigation:navigation-compose:2.9.8'
  implementation 'sh.calvin.reorderable:reorderable:3.1.0'
  implementation 'com.github.skydoves:colorpicker-compose:1.1.3'
}
